# Makes omuo weather's App Intents metadata (Metadata.appintents: what Siri, Shortcuts, Spotlight and the widgets'
# settings read to know its actions and options) with Xcode, on one of GitHub's Macs. Only Xcode's build makes that
# metadata, and xtool doesn't run that step. The intents' code is the app's ios/Sources/WeatherIntents, copied here by
# scripts/intents.sh, and built in small throwaway apps whose module is also called WeatherIntents, so the metadata
# names the same types the real app and widgets have:
#   app/      every intent, with the App Shortcuts (Siri's phrases): bundled in the app
#   widgets/  the place and the widget's settings only: bundled in the widget extension
# The results are the "metadata" artifact, which scripts/intents.sh downloads into ios/Resources/Intents/.
name: App Intents metadata

on:
  workflow_dispatch:
  push:

jobs:
  metadata:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode in use
        run: xcodebuild -version

      - name: Two small apps around the intents
        run: |
          set -euo pipefail
          brew install xcodegen
          for kind in app widgets; do
            rm -rf "build/$kind" && mkdir -p "build/$kind/Sources"
            if [ "$kind" = app ]; then
              cp Intents/*.swift "build/$kind/Sources/"
            else
              cp Intents/Places.swift Intents/WidgetIntent.swift "build/$kind/Sources/"
            fi
            cat > "build/$kind/Sources/HostApp.swift" <<'EOF'
          import SwiftUI
          @main struct HostApp: App { var body: some Scene { WindowGroup { Text("omuo weather") } } }
          EOF
            cat > "build/$kind/project.yml" <<EOF
          name: IntentsHost
          options:
            deploymentTarget:
              iOS: "17.0"
          packages:
            Shared:
              path: ../../Shared
          targets:
            IntentsHost:
              type: application
              platform: iOS
              sources: [Sources]
              dependencies:
                - package: Shared
                  product: WeatherShared
              settings:
                base:
                  PRODUCT_NAME: IntentsHost
                  PRODUCT_MODULE_NAME: WeatherIntents
                  PRODUCT_BUNDLE_IDENTIFIER: nyc.nikola.weather
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_CFBundleDisplayName: omuo weather
                  SWIFT_VERSION: "5.0"
                  CODE_SIGNING_ALLOWED: NO
                  TARGETED_DEVICE_FAMILY: "1"
          EOF
            (cd "build/$kind" && xcodegen generate)
          done

      - name: Build them (Xcode makes the metadata as it does)
        run: |
          set -euo pipefail
          mkdir -p out
          for kind in app widgets; do
            (cd "build/$kind" && xcodebuild -project IntentsHost.xcodeproj -scheme IntentsHost -configuration Release \
              -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO SYMROOT="$PWD/products" build | tail -30)
            app="build/$kind/products/Release-iphoneos/IntentsHost.app"
            test -d "$app/Metadata.appintents"
            mkdir -p "out/$kind"
            cp -R "$app/Metadata.appintents" "out/$kind/"
            ls -la "out/$kind/Metadata.appintents"
          done
          xcodebuild -version | head -1 > out/XCODE.txt

      - uses: actions/upload-artifact@v4
        with:
          name: metadata
          path: out
